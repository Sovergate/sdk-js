name: Publish to npm

# Runs when a GitHub Release is published. Uses npm Trusted Publishing (OIDC),
# so no npm token is stored in this repository. Pre-releases go to the "alpha"
# dist-tag, full releases to "latest".
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing (OIDC) needs npm 11.5.1 or newer
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm test
      # The dist-tag comes from the version itself: 0.1.0-alpha.2 → "alpha", 1.0.0 → "latest".
      # The release tag must match package.json, so a mistyped tag can't publish the wrong version.
      - name: Check version and choose dist-tag
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "${{ github.event.release.tag_name }}" != "v$VERSION" ]; then
            echo "Release tag ${{ github.event.release.tag_name }} does not match package.json version v$VERSION"
            exit 1
          fi
          case "$VERSION" in
            *-*) echo "tag=$(echo "$VERSION" | sed -E 's/^[^-]+-([a-z]+).*/\1/')" >> "$GITHUB_OUTPUT" ;;
            *)   echo "tag=latest" >> "$GITHUB_OUTPUT" ;;
          esac
      # prepublishOnly runs typecheck and build
      - run: npm publish --tag ${{ steps.version.outputs.tag }}
